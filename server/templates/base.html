<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bangalore House Price Predictor{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    {% block extra_css %}{% endblock %}
</head>

<body>

<div class="bg-image"></div>

<!-- Navbar -->
<nav class="navbar">
    <div class="navbar-inner">
        <a href="{{ url_for('home') }}" class="brand">🏠 BHP<span>Predictor</span></a>

        <button id="navToggle" class="nav-toggle" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <ul id="navLinks" class="nav-links">
            <li><a href="{{ url_for('home') }}" class="{% if request.path == url_for('home') %}active{% endif %}">Home</a></li>
            <li><a href="{{ url_for('predict') }}" class="{% if request.path == url_for('predict') %}active{% endif %}">Predict</a></li>
            <li><a href="{{ url_for('compare') }}" class="{% if request.path == url_for('compare') %}active{% endif %}">Compare</a></li>
            <li><a href="{{ url_for('about') }}" class="{% if request.path == url_for('about') %}active{% endif %}">About</a></li>
        </ul>

        <button id="themeToggle" class="theme-toggle" title="Toggle dark mode">🌙</button>
    </div>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <p>Built with <strong>Flask</strong> &amp; <strong>Scikit-learn</strong> · Bangalore House Price Predictor &copy; 2026</p>
</footer>

<script src="{{ url_for('static', filename='js/base.js') }}"></script>
{% block extra_js %}{% endblock %}

</body>

</html>
