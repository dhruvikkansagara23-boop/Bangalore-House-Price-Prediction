{% extends "base.html" %}

{% block title %}History · Bangalore House Price Predictor{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/predict.css') }}">
<style>
    .history-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
    }
    .history-table th, .history-table td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid var(--border-color);
    }
    .history-table th {
        background-color: var(--bg-alt);
        color: var(--text-primary);
    }
    .history-table tr:hover {
        background-color: rgba(255, 255, 255, 0.02);
    }
    .btn-small {
        padding: 5px 10px;
        font-size: 0.85rem;
        border-radius: 4px;
        cursor: pointer;
        border: none;
        color: white;
        text-decoration: none;
    }
    .btn-pdf { background-color: var(--accent); }
    .btn-del { background-color: #ef4444; margin-left: 5px;}
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 class="card-title" style="margin-bottom: 0;">🕘 Prediction History</h2>
            <a href="/export/csv" class="btn-small" style="background-color: #10b981;">Download CSV</a>
        </div>
        <div style="overflow-x: auto; margin-top: 15px;">
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Location</th>
                        <th>Area</th>
                        <th>BHK</th>
                        <th>Price</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="history-body">
                    <tr><td colspan="6" style="text-align: center;">Loading history...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/history.js') }}"></script>
{% endblock %}
